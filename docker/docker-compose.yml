version: "3.8"

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MODEL_NAME=efficientnet_b0
    depends_on:
      - redis
    command: python -m larpy.api.server

  worker:
    build: .
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MODEL_NAME=efficientnet_b0
    depends_on:
      - redis
      - api
    command: python -m larpy.workers.worker

  frontend:
    build: .
    ports:
      - "8501:8501"
    environment:
      - STREAMLIT_SERVER_PORT=8501
    depends_on:
      - api
    command: streamlit run larpy/frontend/app.py --server.port 8501

volumes:
    redis_data:
