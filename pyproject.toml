[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "larpy"
version = "0.1.0"
description = "ML-powered object price estimator (1-10 scale)"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1.0",
    "torchvision>=0.16.0",
    "timm>=0.9.5",
    "transformers>=4.36.0",
    "redis>=5.0.0",
    "rq>=1.15.0",
    "streamlit>=1.30.0",
    "scikit-learn>=1.3.0",
    "xgboost>=2.0.0",
    "lightgbm>=4.0.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "pillow>=10.0.0",
    "opencv-python>=4.8.0",
    "sentence-transformers>=2.2.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "joblib>=1.3.0",
    "hydra-core>=1.3.0",
    "httpx>=0.25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "black>=23.0",
    "flake8>=6.0",
    "mypy>=1.5",
]
docker = [
    "docker>=6.1.0",
]

[project.scripts]
larpy-worker = "larpy.workers.worker:main"
larpy-train = "larpy.models.train:main"
larpy-api = "larpy.api.server:main"

[tool.setuptools.packages.find]
include = ["larpy*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
